<svg width="480" height="360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Food icon -->
  <g transform="translate(240, 130)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="white" opacity="0.9" />
    <path d="M-20,-20 L20,-20 L20,20 L-20,20 Z" fill="none" stroke="#4caf50" stroke-width="5" stroke-linejoin="round" />
    <path d="M-10,-30 L-10,30" stroke="#4caf50" stroke-width="5" stroke-linecap="round" />
    <path d="M10,-30 L10,30" stroke="#4caf50" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <!-- Text -->
  <text x="50%" y="230" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white" filter="url(#shadow)">
    AI Generated Recipe
  </text>
  <text x="50%" y="260" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.9">
    PantryPal Custom Creation
  </text>
</svg> 