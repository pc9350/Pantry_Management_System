<svg width="480" height="360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Food icon -->
  <g transform="translate(240, 130)">
    <circle cx="0" cy="0" r="60" fill="white" stroke="#ccc" stroke-width="2" />
    <path d="M-25,-15 L25,-15 M-25,0 L25,0 M-25,15 L25,15" stroke="#888" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <!-- Text -->
  <text x="50%" y="230" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666">
    Image Not Available
  </text>
  <text x="50%" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#888">
    PantryPal Recipe
  </text>
</svg> 